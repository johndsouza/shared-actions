name: Node.js CI setup 
description: Testing 

runs:
   using: composite
   steps:
     - name: Set up Node.js
       uses: actions/setup-node@v7
       with:
          node-version: '24.x'
          cache: npm

     - name: Install dependencies
       run: npm ci
       shell: bash

     - name: Run tests
       run: npm test
