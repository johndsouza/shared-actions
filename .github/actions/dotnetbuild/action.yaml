name: Dotnet CI setup 
description:  Build Dotnet applications 

inputs:
  dotnet-version:
    description: .NET SDK version
    required: false
    default: "8.0.x"
  web-project:
    description: Path to the web project
    required: true
  test-project:
    description: Path to the test project
    required: true
  
runs:
   using: composite
   steps:
     - name: Install .NET SDK
       uses: actions/setup-dotnet@v4
       with:
          dotnet-version: ${{ inputs.DOTNET_VERSION }}

     - name: Restore web application
       run: dotnet restore "$env:PROJECT"
       shell: bash
       env:
        PROJECT: ${{ inputs.web-project }}

     - name: Restore test project
       run: dotnet restore "$env:PROJECT"
       shell: bash
       env:
         PROJECT: ${{ inputs.test-project }}
    

       
