name: Dotnet CI setup
description: Build .NET applications

inputs:
  dotnet-version:
    description: .NET SDK version
    required: false
    default: "8.0.x"
  web-project:
    description: Path to the web project
    required: true
  test-project:
    description: Path to the test project
    required: true

runs:
  using: composite
  steps:
    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Restore web application
      run: dotnet restore "${{ inputs.web-project }}"
      shell: bash

    - name: Restore test project
      run: dotnet restore "${{ inputs.test-project }}"
      shell: bash
